name: Playwright CI

on:
  push:
    branches:
      - main
      - feature/**
      - fix/**
  pull_request:
    branches:
      - main

jobs:
  playwright-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test 

      # 1. Tải thư mục test-results (Nơi chứa trace.zip và screenshot khi test fail)
      - name: Upload Test Results and Traces
        if: failure() # Chỉ cần tải khi có test fail để tiết kiệm dung lượng
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      # 2. Tải thư mục chứa dữ liệu thô của Allure
      - name: Upload Allure Results
        if: always() # Luôn luôn tải về dù test pass hay fail
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7
